<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="form1.css">
  <script src="form1.js" defer></script>
</head>

<body>
  <form action="javascript:">
    <h1>Create an Account</h1>

    <label class="up">First Name
      <input type="text" name="firstname" required>
    </label>

    <label class="up">Last Name
      <input type="text" name="lastname" required>
    </label>

    <label>E-mail
      <input type="email" name="email" required>
    </label>

    <p>We'll never share your email with anyone else.</p>

    <label>
      <input type="radio" name="gender" value="male">
      <svg class="radio-on" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="10" fill="#007BFF" />
        <circle cx="10" cy="10" r="4" fill="white" />
      </svg>
      <svg class="radio-off" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9.5" fill="white" stroke="#E4E4E4" />
      </svg>
      <span>Male</span>
    </label>

    <label>
      <input type="radio" name="gender" value="female">
      <svg class="radio-on" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="10" fill="#007BFF" />
        <circle cx="10" cy="10" r="4" fill="white" />
      </svg>
      <svg class="radio-off" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9.5" fill="white" stroke="#E4E4E4" />
      </svg>
      <span>Female</span>
    </label>


    <label class="up">
      <span>Country</span>
      <select name="country" required>
        <option value="" disabled selected hidden>Select</option>
        <option value="usa">USA</option>
        <option value="canada">Canada</option>
        <option value="uk">UK</option>
        <option value="australia">Australia</option>
      </select>
    </label>

    <label class="up"> City
      <input type="text" name="city">
    </label>

    <button>Sign Up</button>

    <p>By clicking the 'Sign Up' button, you confirm that you accept our<br>
      <a href="#">Terms of Use</a> and
      <a href="#">Privacy Policy</a>.
    </p>
    <hr>

    <footer>
      <p>Have an account?</p>
      <a href="form2.html">Log In</a>
    </footer>

  </form>
  
  <ul>
  </ul>
</body>

</html>
